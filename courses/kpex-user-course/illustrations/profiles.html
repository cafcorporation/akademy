<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Kpex user profiles</title>
<!-- Lesson 1.3 illustration. 1440×820. ?lang=es|en → screenshots/<lang>/1.3-profiles.png -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1440px; height: 820px; overflow: hidden; }
  body { font-family: 'Inter', Arial, sans-serif; color: #fff;
         background: radial-gradient(60% 80% at 50% 45%, rgba(245,160,17,.14), transparent 70%), linear-gradient(135deg, #1a1a18 0%, #2e2e2c 100%); position: relative; }
  .head { position: absolute; left: 0; right: 0; top: 52px; text-align: center; }
  .pill { display: inline-block; background: rgba(245,160,17,.12); border: 1.5px solid rgba(245,160,17,.3); color: #F5A011;
          border-radius: 30px; padding: 6px 18px; font-size: 13px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; }
  h1 { margin-top: 16px; font-size: 40px; font-weight: 900; letter-spacing: -1.2px; }
  .hub { position: absolute; left: 50%; top: 440px; transform: translate(-50%, -50%); width: 230px; height: 230px; border-radius: 50%;
         background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
         box-shadow: 0 0 0 14px rgba(245,160,17,.12), 0 0 0 30px rgba(245,160,17,.06), 0 30px 80px rgba(0,0,0,.45); }
  .hub .k { font-size: 64px; font-weight: 900; letter-spacing: -2.5px; color: #1a1a1a; line-height: 1; }
  .hub .k span { color: #F5A011; }
  .hub .s { margin-top: 8px; font-size: 12px; font-weight: 800; letter-spacing: .9px; text-transform: uppercase; color: #888; }
  svg.links { position: absolute; inset: 0; }
  .card { position: absolute; width: 400px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
          border-radius: 18px; padding: 22px 24px; backdrop-filter: blur(4px); }
  .card .t { display: flex; align-items: center; gap: 14px; }
  .card .ic { width: 48px; height: 48px; border-radius: 12px; background: #F5A011; display: flex; align-items: center; justify-content: center; flex: none; }
  .card .ic svg { width: 26px; height: 26px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .card h3 { font-size: 20px; font-weight: 800; letter-spacing: -.3px; }
  .card p { margin-top: 12px; font-size: 14.5px; line-height: 1.55; color: #d9d5cc; }
  .c1 { left: 90px;  top: 190px; } .c2 { right: 90px; top: 190px; }
  .c3 { left: 90px;  top: 520px; } .c4 { right: 90px; top: 520px; }
</style>
</head>
<body>
  <div class="head"><span class="pill" data-t="pill"></span><h1 data-t="title"></h1></div>
  <svg class="links" viewBox="0 0 1440 820" aria-hidden="true">
    <g stroke="#F5A011" stroke-width="2" stroke-dasharray="6 7" fill="none" opacity=".55">
      <path d="M490 260 C 580 260, 600 360, 640 400"/><path d="M950 260 C 860 260, 840 360, 800 400"/>
      <path d="M490 600 C 580 600, 600 500, 640 480"/><path d="M950 600 C 860 600, 840 500, 800 480"/>
    </g>
  </svg>
  <div class="hub"><div class="k">Kp<span>ex</span></div><div class="s">CAF Corporation</div></div>

  <div class="card c1"><div class="t"><div class="ic"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg></div><h3 data-t="p1"></h3></div><p data-t="d1"></p></div>
  <div class="card c2"><div class="t"><div class="ic"><svg viewBox="0 0 24 24"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg></div><h3 data-t="p2"></h3></div><p data-t="d2"></p></div>
  <div class="card c3"><div class="t"><div class="ic"><svg viewBox="0 0 24 24"><path d="M3 21V9l6-4v16M9 21V11l6-3v13M15 21V13l6-3v11"/></svg></div><h3 data-t="p3"></h3></div><p data-t="d3"></p></div>
  <div class="card c4"><div class="t"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></div><h3 data-t="p4"></h3></div><p data-t="d4"></p></div>

<script>
  const T = {
    es: { pill: 'Lección 1.3', title: 'Cuatro perfiles, una plataforma',
      p1: 'Ingenieros de costos', d1: 'Estimados paramétricos y detallados, de la Clase 5 a la Clase 2, con componentes, factores de ubicación e índices en un solo flujo.',
      p2: 'Gerentes de proyecto (PMI)', d2: 'Inician un estimado en lenguaje de gestión de proyectos; Kpex lo traduce a una estructura de costos ordenada.',
      p3: 'EPC y consultoras', d3: 'Comparan con datos históricos, validan la factibilidad y generan reportes PDF listos para el cliente.',
      p4: 'Dueños, operadores y NOC', d4: 'Revisan estimados de los EPC, piden precios en Kpex Exchange y siguen CAPEX → OPEX → ABEX.' },
    en: { pill: 'Lesson 1.3', title: 'Four profiles, one platform',
      p1: 'Cost engineers', d1: 'Parametric and detailed estimates from Class 5 to Class 2, with components, location factors and indices in one workflow.',
      p2: 'Project managers (PMI)', d2: 'Start an estimate in project-management language; Kpex turns the scope into a structured cost breakdown.',
      p3: 'EPCs and consultancies', d3: 'Benchmark against historical data, validate feasibility and produce client-ready PDF reports.',
      p4: 'Owners, operators & NOCs', d4: 'Review EPC estimates, request pricing on Kpex Exchange and track CAPEX → OPEX → ABEX.' },
  };
  const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'es';
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = T[lang][el.dataset.t]; });
</script>
</body>
</html>
