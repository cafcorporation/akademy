<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Akdemy social</title>
<!--
  Akdemy · social media pieces for the Kpex course launch.
  ?piece=launch|hands|cert  ?fmt=square|portrait|story|landscape  ?lang=es|en
  Rendered by tools/render-social.ps1 at the exact pixel size of each format.
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --o: #F5A011; --od: #d4880a; --ink: #1a1a1a; --d1: #1a1a18; --d2: #2e2e2c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  body { font-family: 'Inter', Arial, sans-serif; color: #fff; background: var(--d1); position: relative;
         --u: calc(min(var(--w), var(--h)) / 100); }            /* 1u = 1% of the short side */
  .frame { position: absolute; inset: 0; display: flex; flex-direction: column; padding: calc(6 * var(--u)); }
  .bg { position: absolute; inset: 0; background-size: cover; background-position: 62% center; }
  .scrim { position: absolute; inset: 0; }
  .top { position: relative; display: flex; justify-content: space-between; align-items: center; }
  .logo { height: calc(7.5 * var(--u)); }
  .pill { display: inline-block; background: rgba(245,160,17,.14); border: calc(.25 * var(--u)) solid rgba(245,160,17,.4); color: var(--o);
          border-radius: 99px; padding: calc(1 * var(--u)) calc(2.6 * var(--u)); font-size: calc(2.3 * var(--u)); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  .body { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; }
  h1 { font-size: calc(10.5 * var(--u)); font-weight: 900; letter-spacing: -.04em; line-height: 1; margin: calc(2.5 * var(--u)) 0 calc(2 * var(--u)); }
  h1 span, h2 span { color: var(--o); }
  h2 { font-size: calc(7.2 * var(--u)); font-weight: 900; letter-spacing: -.035em; line-height: 1.04; margin: calc(2 * var(--u)) 0 calc(1.8 * var(--u)); }
  .sub { font-size: calc(3.3 * var(--u)); line-height: 1.4; color: #e6e3dc; max-width: calc(80 * var(--u)); }
  .chips { display: flex; flex-wrap: wrap; gap: calc(1.2 * var(--u)); margin-top: calc(3.5 * var(--u)); }
  .chip { background: rgba(255,255,255,.08); border: calc(.2 * var(--u)) solid rgba(255,255,255,.24); border-radius: calc(1.6 * var(--u));
          padding: calc(1.2 * var(--u)) calc(2 * var(--u)); font-size: calc(2.5 * var(--u)); font-weight: 700; }
  .chip b { color: var(--o); }
  .price { display: inline-flex; align-items: center; gap: calc(2.2 * var(--u)); background: #fff; color: var(--ink);
           border-radius: calc(2.2 * var(--u)); padding: calc(1.6 * var(--u)) calc(2.8 * var(--u)) calc(1.6 * var(--u)) calc(1.8 * var(--u));
           box-shadow: 0 calc(2 * var(--u)) calc(6 * var(--u)) rgba(0,0,0,.4); align-self: flex-start; }
  .price .tag { background: var(--o); color: #fff; border-radius: calc(1.4 * var(--u)); padding: calc(1 * var(--u)) calc(1.6 * var(--u));
                font-size: calc(1.9 * var(--u)); font-weight: 900; text-transform: uppercase; letter-spacing: .05em; line-height: 1.15; }
  .price .now { font-size: calc(6 * var(--u)); font-weight: 900; letter-spacing: -.03em; line-height: 1; }
  .price .was { font-size: calc(2.6 * var(--u)); color: #888; text-decoration: line-through; font-weight: 600; margin-left: calc(1 * var(--u)); }
  .pricewrap { display: inline-block; }
  .free { margin-top: calc(1.6 * var(--u)); font-size: calc(2.5 * var(--u)); font-weight: 800; color: #F5A011; letter-spacing: -.01em; }
  .light .free { color: #d4880a; }
  .cta { position: relative; margin-top: calc(3 * var(--u)); display: inline-block; align-self: flex-start; background: var(--o); color: #fff;
         border-radius: calc(1.6 * var(--u)); padding: calc(1.8 * var(--u)) calc(3.2 * var(--u)); font-size: calc(3 * var(--u)); font-weight: 900; }
  .base { position: relative; display: flex; align-items: center; gap: calc(2.2 * var(--u)); border-top: calc(.2 * var(--u)) solid rgba(255,255,255,.14);
          padding-top: calc(2.6 * var(--u)); margin-top: calc(3 * var(--u)); }
  .base img { height: calc(5 * var(--u)); }
  .base .sup { border-left: calc(.2 * var(--u)) solid rgba(255,255,255,.2); padding-left: calc(2.2 * var(--u)); font-size: calc(2.1 * var(--u)); color: #d9d5cc; line-height: 1.3; }
  .base .sup small { display: block; color: var(--o); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; font-size: calc(1.6 * var(--u)); }
  .base .sup b { color: #fff; }
  .base .url { margin-left: auto; font-size: calc(2.2 * var(--u)); font-weight: 700; color: #fff; }
  .shot { width: 100%; border-radius: calc(1.6 * var(--u)); border: calc(.25 * var(--u)) solid rgba(255,255,255,.18);
          box-shadow: 0 calc(3 * var(--u)) calc(8 * var(--u)) rgba(0,0,0,.5); display: block; object-fit: cover; object-position: top; }
  .gets { list-style: none; margin-top: calc(2 * var(--u)); }
  .gets li { display: flex; gap: calc(1.6 * var(--u)); align-items: center; font-size: calc(2.9 * var(--u)); padding: calc(.9 * var(--u)) 0; color: #e6e3dc; }
  .gets li::before { content: '✓'; flex: none; width: calc(4 * var(--u)); height: calc(4 * var(--u)); border-radius: 50%; background: rgba(245,160,17,.2); color: var(--o);
                     display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: calc(2.3 * var(--u)); }
  .gets b { color: #fff; }
  .row { display: flex; gap: calc(4 * var(--u)); align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .glow::after { content: ''; position: absolute; right: -20%; top: -25%; width: 70%; height: 70%; border-radius: 50%;
                 background: radial-gradient(circle, rgba(245,160,17,.22), transparent 65%); pointer-events: none; }
  /* Light theme (certificate piece): cream canvas so the certificate stands out; the dark base strip keeps the white CAF logo. */
  body.light { background: #F8F6F2; color: var(--ink); }
  .light h2 { color: var(--ink); }
  .light .pill { color: var(--od); background: rgba(245,160,17,.12); border-color: rgba(245,160,17,.45); }
  .light .gets li { color: #4a4a47; }
  .light .gets b { color: var(--ink); }
  .light .gets li::before { background: var(--o); color: #fff; }
  .light .shot { border-color: #e2ddd3; box-shadow: 0 calc(2.5 * var(--u)) calc(6 * var(--u)) rgba(26,26,24,.22); }
  .light .price { border: calc(.2 * var(--u)) solid #ece7de; box-shadow: 0 calc(1.5 * var(--u)) calc(4 * var(--u)) rgba(26,26,24,.12); }
  .light .glow::after { background: radial-gradient(circle, rgba(245,160,17,.16), transparent 65%); }
  .light .base { background: var(--d1); border-top: calc(.4 * var(--u)) solid var(--o);
                 margin: calc(3 * var(--u)) calc(-6 * var(--u)) calc(-6 * var(--u)); padding: calc(2.6 * var(--u)) calc(6 * var(--u)) calc(3.4 * var(--u)); }
</style>
</head>
<body>
<div id="app"></div>
<script>
  const q = new URLSearchParams(location.search);
  const lang = q.get('lang') === 'en' ? 'en' : 'es';
  const piece = q.get('piece') || 'launch';
  const fmt = q.get('fmt') || 'square';
  const SIZE = { square: [1080, 1080], portrait: [1080, 1350], story: [1080, 1920], landscape: [1200, 627] }[fmt];
  document.documentElement.style.setProperty('--w', SIZE[0] + 'px');
  document.documentElement.style.setProperty('--h', SIZE[1] + 'px');
  document.documentElement.lang = lang;
  const wide = fmt === 'landscape';
  const tall = fmt === 'story' || fmt === 'portrait';

  const T = {
    es: {
      newCourse: 'Nuevo curso', official: 'Curso oficial',
      title: 'Cómo usar <span>Kpex</span>',
      sub: 'Estimación de CAPEX de la Clase 5 a la Clase 2 con la plataforma de inteligencia de costos de CAF Corporation.',
      chips: ['<b>9</b> módulos', '<b>27</b> lecciones', 'Certificado', 'ES · EN'],
      tag: 'Precio de<br>lanzamiento', cta: 'Inscripciones abiertas', free: 'o gratis con tu plan de Kpex',
      handsPill: 'Aprende haciendo', handsTitle: 'Tu primer estimado Clase 5, <span>paso a paso</span>',
      handsSub: 'Una planta solar de 100 MWp: de la curva de costo al reporte PDF, dentro de Kpex.',
      certPill: 'Al terminar', certTitle: 'Tu certificado, <span>y más</span>',
      gets: ['<b>Certificado</b> verificable con QR', '<b>Firmado</b> por los facilitadores de CAF', '<b>Descuento</b> en tu membresía Kpex'],
    },
    en: {
      newCourse: 'New course', official: 'Official course',
      title: 'How to Use <span>Kpex</span>',
      sub: 'CAPEX estimating from Class 5 to Class 2 with CAF Corporation’s cost intelligence platform.',
      chips: ['<b>9</b> modules', '<b>27</b> lessons', 'Certificate', 'EN · ES'],
      tag: 'Launch<br>price', cta: 'Enrolment now open', free: 'or free with your Kpex plan',
      handsPill: 'Learn by doing', handsTitle: 'Your first Class 5 estimate, <span>step by step</span>',
      handsSub: 'A 100 MWp solar PV plant: from the cost curve to the PDF report, inside Kpex.',
      certPill: 'When you finish', certTitle: 'Your certificate, <span>and more</span>',
      gets: ['<b>Certificate</b> verifiable by QR code', '<b>Signed</b> by the CAF facilitators', '<b>Discount</b> on your Kpex membership'],
    },
  }[lang];

  const light = piece === 'cert';
  document.body.classList.toggle('light', light);
  const img = (f) => `../brochure/img/${f}`;
  const price = `<div class="pricewrap"><div class="price"><div class="tag">${T.tag}</div><div><span class="now">20 €</span><span class="was">100 €</span></div></div><div class="free">${T.free}</div></div>`;
  const base = `<div class="base"><img src="${img('caf-white.svg')}" alt="CAF"><div class="sup"><small>Supported by</small><b>KPEX</b> · Project Cost Intelligence Platform</div><div class="url">Akdemy · CAF Corporation</div></div>`;
  const topBar = (pill) => `<div class="top"><img class="logo" src="${img(light ? 'akdemy.svg' : 'akdemy-white.svg')}" alt="Akdemy"><span class="pill">${pill}</span></div>`;

  const P = {
    launch: () => `
      <div class="bg" style="background-image:url('${img('bg-dark.jpg')}')"></div>
      <div class="scrim" style="background:linear-gradient(${wide ? '90deg' : '180deg'}, rgba(26,26,24,.35) 0%, rgba(26,26,24,.80) ${wide ? '45%' : '38%'}, rgba(26,26,24,${wide ? '.55' : '.94'}) 100%)"></div>
      <div class="frame">
        ${topBar(T.newCourse)}
        <div class="body" style="${tall ? 'justify-content:flex-end' : ''}">
          <span class="pill" style="align-self:flex-start">${T.official} · Akdemy</span>
          <h1>${T.title}</h1>
          <p class="sub">${T.sub}</p>
          ${wide ? '' : `<div class="chips">${T.chips.map((c) => `<span class="chip">${c}</span>`).join('')}</div>`}
          <div style="margin-top:calc(${wide ? 3 : 4.5} * var(--u))">${price}</div>
          ${tall ? `<span class="cta">${T.cta} →</span>` : ''}
        </div>
        ${base}
      </div>`,
    hands: () => `
      <div class="bg glow" style="background:linear-gradient(135deg,#1a1a18,#2e2e2c)"></div>
      <div class="frame">
        ${topBar(T.handsPill)}
        ${wide
          ? `<div class="body"><div class="row"><div class="grow"><h2>${T.handsTitle}</h2><p class="sub">${T.handsSub}</p><div style="margin-top:calc(3 * var(--u))">${price}</div></div>
               <div style="width:52%"><img class="shot" src="${img('shot-curve.jpg')}" style="height:calc(52 * var(--u))"></div></div></div>`
          : `<div class="body"><h2>${T.handsTitle}</h2><p class="sub">${T.handsSub}</p>
               <img class="shot" src="${img('shot-curve.jpg')}" style="margin-top:calc(4 * var(--u)); height:calc(${fmt === 'story' ? 88 : fmt === 'portrait' ? 50 : 40} * var(--u))">
               <div style="margin-top:calc(4 * var(--u))">${price}</div></div>`}
        ${base}
      </div>`,
    cert: () => `
      <div class="bg glow" style="background:linear-gradient(135deg,#FFFFFF,#F3EFE7)"></div>
      <div class="frame">
        ${topBar(T.certPill)}
        ${wide
          ? `<div class="body"><div class="row"><div class="grow"><h2>${T.certTitle}</h2><ul class="gets">${T.gets.map((g) => `<li><span>${g}</span></li>`).join('')}</ul></div>
               <div style="width:50%"><img class="shot" src="${img(`cert-${lang}.jpg`)}"></div></div></div>`
          : fmt === 'square'
          ? `<div class="body"><h2>${T.certTitle}</h2>
               <div class="row" style="margin-top:calc(2 * var(--u))"><ul class="gets grow">${T.gets.map((g) => `<li><span>${g}</span></li>`).join('')}</ul>
               <div style="width:52%"><img class="shot" src="${img(`cert-${lang}.jpg`)}"></div></div>
               <div style="margin-top:calc(4 * var(--u))">${price}</div></div>`
          : `<div class="body"><h2>${T.certTitle}</h2>
               <img class="shot" src="${img(`cert-${lang}.jpg`)}" style="margin-top:calc(3 * var(--u))">
               <ul class="gets">${T.gets.map((g) => `<li><span>${g}</span></li>`).join('')}</ul>
               ${fmt === 'story' ? `<div style="margin-top:calc(4 * var(--u))">${price}</div><span class="cta">${T.cta} →</span>` : ''}</div>`}
        ${base}
      </div>`,
  };
  document.getElementById('app').innerHTML = P[piece]();
</script>
</body>
</html>
